[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "j7scope"
version = "0.1.0"
description = "Testing cross-lingual generalization of the J-space / global workspace in language models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "transformers>=4.45",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter", "matplotlib"]
fit = ["datasets>=3.0"]
upstream = [
    "jlens @ git+https://github.com/anthropics/jacobian-lens.git@581d398613e5602a5af361e1c34d3a92ea82ba8e",
]

[tool.setuptools]
packages = ["j7scope"]
