[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "j7scope"
version = "0.2.0rc2"
description = "Self-hosted LLM representation observatory and reproducible J-lens research toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "tqdm",
]

[project.scripts]
j7scope = "j7scope_serve.__main__:main"
j7scope-serve = "j7scope_serve.__main__:main"
j7scope-validate = "j7scope_serve.validation:main"

[project.entry-points."j7scope.backends"]
hf = "j7scope_serve.backends:HFBackend"
mock = "j7scope_serve.backends:MockBackend"

[project.optional-dependencies]
hf = ["torch>=2.1", "transformers>=4.45,<6", "safetensors>=0.4"]
dev = ["pytest", "jupyter", "matplotlib", "build", "twine", "torch>=2.1", "transformers>=4.45,<6"]
fit = ["datasets>=3.0", "torch>=2.1", "transformers>=4.45,<6"]
upstream = [
    "torch>=2.1",
    "transformers>=4.45,<6",
    "jlens @ git+https://github.com/anthropics/jacobian-lens.git@581d398613e5602a5af361e1c34d3a92ea82ba8e",
]

[tool.setuptools]
packages = ["j7scope", "j7scope_serve"]
package-dir = {j7scope = "j7scope", j7scope_serve = "apps/serve/j7scope_serve"}
include-package-data = true
